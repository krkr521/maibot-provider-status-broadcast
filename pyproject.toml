[project]
name = "maibot-provider-status-broadcast"
version = "1.0.3"
description = "maibot-provider-status-broadcast for MaiBot"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["maibot-plugin-sdk>=2.19.0,<3", "curl-cffi>=0.16.3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
